<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Crear o editar rutina</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400;1,500&amp;family=Jost:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
.t-dark{--bg:#0D0A10;--surface:#16111A;--raised:#1F1826;--line:#2F2539;--fg:#EEE7DC;--muted:#A3969F;--purple:#6B3A9E;--purple-ink:#B892E0;--purple-faint:rgba(184,146,224,.12);--crimson:#9B1E33;--crimson-ink:#E35C70;--gold:#CFA54E;--gold-faint:rgba(207,165,78,.16);--on-accent:#F7F1E6;--good:#6FB07C;--warn:#D9A441}
.t-light{--bg:#E4D9C6;--surface:#EDE4D3;--raised:#D8CAB2;--line:#C6B396;--fg:#1D1421;--muted:#5A4C55;--purple:#4B2275;--purple-ink:#4B2275;--purple-faint:rgba(75,34,117,.12);--crimson:#7D1628;--crimson-ink:#8F1A2E;--gold:#85631A;--gold-faint:rgba(133,99,26,.14);--on-accent:#F3ECDF;--good:#2F6A3D;--warn:#8E6514}
a{color:var(--purple-ink)}a:hover{color:var(--gold)}
.day{font:inherit;font-size:13px;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--fg);cursor:pointer}
.day-on{background:var(--purple);border-color:var(--purple);color:var(--on-accent);font-weight:500}
.step{font:inherit;font-size:18px;width:36px;height:36px;border-radius:8px;border:0;background:var(--raised);color:var(--fg);cursor:pointer}
</style>
</helmet>
<div class="{{themeClass}}" style="width: 390px; height: 1040px; box-sizing: border-box; background: var(--bg); color: var(--fg); font-family: Jost, 'Century Gothic', system-ui, sans-serif; font-size: 15px; line-height: 1.45; display: flex; flex-direction: column; overflow: hidden">

  <header style="display: flex; align-items: center; gap: 8px; padding: 14px 12px; border-bottom: 1px solid var(--line)">
    <button type="button" style="font: inherit; font-size: 15px; color: var(--muted); background: transparent; border: 0; height: 44px; padding: 0 10px; cursor: pointer">Cancelar</button>
    <span style="flex-grow: 1; text-align: center; font-weight: 500">Editar rutina</span>
    <button type="button" style="font: inherit; font-size: 15px; font-weight: 500; color: var(--on-accent); background: var(--purple); border: 0; border-radius: 10px; height: 40px; padding: 0 16px; cursor: pointer">Guardar</button>
  </header>

  <div style="flex-grow: 1; padding: 20px; display: flex; flex-direction: column; gap: 20px; overflow: hidden">

    <label style="display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted)">Nombre</span>
      <input value="Empuje" style="font: inherit; font-size: 24px; font-weight: 500; color: var(--fg); background: transparent; border: 0; border-bottom: 1px solid var(--line); padding: 4px 0 8px; outline: none">
    </label>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted)">Días que la haces (opcional)</span>
      <div style="display: flex; justify-content: space-between">
        <button type="button" class="day day-on" aria-pressed="true" aria-label="Lunes">L</button>
        <button type="button" class="day" aria-pressed="false" aria-label="Martes">M</button>
        <button type="button" class="day" aria-pressed="false" aria-label="Miércoles">M</button>
        <button type="button" class="day day-on" aria-pressed="true" aria-label="Jueves">J</button>
        <button type="button" class="day" aria-pressed="false" aria-label="Viernes">V</button>
        <button type="button" class="day" aria-pressed="false" aria-label="Sábado">S</button>
        <button type="button" class="day" aria-pressed="false" aria-label="Domingo">D</button>
      </div>
      <span style="font-size: 12px; color: var(--muted)">La app te la propone en Inicio esos días.</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; align-items: baseline; justify-content: space-between">
        <span style="font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted)">Ejercicios · 5</span>
        <span style="font-size: 12px; color: var(--muted)">Mantén ⋮⋮ para reordenar</span>
      </div>

      <!-- Ejercicio abierto para editar -->
      <div style="background: var(--surface); border: 1px solid var(--purple-ink); border-radius: 12px; padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 12px">
        <div style="display: flex; align-items: center; gap: 10px">
          <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" style="color: var(--muted); flex-shrink: 0"><g fill="currentColor"><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></g></svg>
          <span style="width: 38px; height: 38px; border-radius: 50%; background: var(--raised); color: var(--purple-ink); display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6.5 7v10M4 9v6M17.5 7v10M20 9v6M6.5 12h11"/></g></svg></span>
          <span style="display: flex; flex-direction: column; flex-grow: 1">
            <span style="font-weight: 600">Press banca</span>
            <span style="font-size: 12px; color: var(--muted)">Pecho · Tríceps · Hombro</span>
          </span>
          <button type="button" aria-label="Quitar ejercicio" style="width: 44px; height: 44px; background: transparent; border: 0; color: var(--crimson-ink); cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 7h14M10 7V5h4v2M7 7l1 12h8l1-12"/></g></svg></button>
        </div>
        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
          <div style="display: flex; flex-direction: column; gap: 6px">
            <span style="font-size: 12px; color: var(--muted)">Series</span>
            <div style="display: flex; align-items: center; justify-content: space-between; gap: 4px">
              <button type="button" class="step" aria-label="Menos series">−</button>
              <span style="font-size: 18px; font-weight: 500; font-variant-numeric: tabular-nums">4</span>
              <button type="button" class="step" aria-label="Más series">+</button>
            </div>
          </div>
          <label style="display: flex; flex-direction: column; gap: 6px">
            <span style="font-size: 12px; color: var(--muted)">Reps objetivo</span>
            <input value="8–10" style="font: inherit; font-size: 16px; font-weight: 500; text-align: center; color: var(--fg); background: var(--raised); border: 0; border-radius: 8px; height: 36px; min-width: 0; font-variant-numeric: tabular-nums">
          </label>
          <label style="display: flex; flex-direction: column; gap: 6px">
            <span style="font-size: 12px; color: var(--muted)">Descanso</span>
            <input value="2:00" style="font: inherit; font-size: 16px; font-weight: 500; text-align: center; color: var(--fg); background: var(--raised); border: 0; border-radius: 8px; height: 36px; min-width: 0; font-variant-numeric: tabular-nums">
          </label>
        </div>
        <label style="display: flex; flex-direction: column; gap: 6px">
          <span style="font-size: 12px; color: var(--muted)">Nota</span>
          <input value="Agarre medio, bajar controlado" style="font: inherit; font-size: 14px; color: var(--fg); background: var(--raised); border: 0; border-radius: 8px; height: 38px; padding: 0 12px; min-width: 0">
        </label>
      </div>

      <!-- Ejercicios cerrados -->
      <sc-for list="{{exercises}}" as="ex" hint-placeholder-count="4">
        <div style="background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 6px 10px 14px; display: flex; align-items: center; gap: 10px">
          <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" style="color: var(--muted); flex-shrink: 0"><g fill="currentColor"><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></g></svg>
          <span style="width: 38px; height: 38px; border-radius: 50%; background: var(--raised); color: var(--purple-ink); display: flex; align-items: center; justify-content: center; flex-shrink: 0">
            <sc-if value="{{ex.isWeights}}" hint-placeholder-val="{{true}}"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6.5 7v10M4 9v6M17.5 7v10M20 9v6M6.5 12h11"/></g></svg></sc-if>
            <sc-if value="{{ex.isBody}}" hint-placeholder-val="{{false}}"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="2"/><path d="M12 8v6M8 10l4-1 4 1M10 21l2-7 2 7"/></g></svg></sc-if>
          </span>
          <span style="display: flex; flex-direction: column; flex-grow: 1; min-width: 0">
            <span style="font-weight: 500">{{ex.name}}</span>
            <span style="font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums">{{ex.meta}}</span>
          </span>
          <button type="button" aria-label="Editar ejercicio" style="width: 44px; height: 44px; background: transparent; border: 0; color: var(--muted); cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        </div>
      </sc-for>

      <a href="Biblioteca.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 48px; border: 1px dashed var(--line); border-radius: 12px; color: var(--purple-ink); font-weight: 500; text-decoration: none">+ Agregar ejercicios</a>
    </div>

    <button type="button" style="font: inherit; font-size: 14px; color: var(--crimson-ink); background: transparent; border: 0; height: 44px; cursor: pointer; align-self: center">Eliminar rutina</button>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"modo":{"editor":"enum","options":["Oscuro","Claro"],"default":"Oscuro"},"$preview":{"width":390,"height":1040}}'>
class Component extends DCLogic {
  renderVals() {
    const ex = (name, meta, kind) => ({ name, meta, isWeights: kind === 'w', isBody: kind === 'b' });
    return {
      themeClass: (this.props.modo ?? 'Oscuro') === 'Claro' ? 't-light' : 't-dark',
      exercises: [
        ex('Press inclinado con mancuernas', '3 series · 10–12 reps · 1:30', 'w'),
        ex('Press militar', '3 series · 6–8 reps · 2:00', 'w'),
        ex('Fondos en paralelas', '3 series · al fallo · 1:30', 'b'),
        ex('Extensión de tríceps en polea', '3 series · 12–15 reps · 1:00', 'w')
      ]
    };
  }
}
</script>
</body>
</html>
