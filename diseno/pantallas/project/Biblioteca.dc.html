<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Biblioteca de ejercicios</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400;1,500&amp;family=Jost:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
.t-dark{--bg:#0D0A10;--surface:#16111A;--raised:#1F1826;--line:#2F2539;--fg:#EEE7DC;--muted:#A3969F;--purple:#6B3A9E;--purple-ink:#B892E0;--purple-faint:rgba(184,146,224,.12);--crimson:#9B1E33;--crimson-ink:#E35C70;--gold:#CFA54E;--gold-faint:rgba(207,165,78,.16);--on-accent:#F7F1E6;--good:#6FB07C;--warn:#D9A441}
.t-light{--bg:#E4D9C6;--surface:#EDE4D3;--raised:#D8CAB2;--line:#C6B396;--fg:#1D1421;--muted:#5A4C55;--purple:#4B2275;--purple-ink:#4B2275;--purple-faint:rgba(75,34,117,.12);--crimson:#7D1628;--crimson-ink:#8F1A2E;--gold:#85631A;--gold-faint:rgba(133,99,26,.14);--on-accent:#F3ECDF;--good:#2F6A3D;--warn:#8E6514}
a{color:var(--purple-ink)}a:hover{color:var(--gold)}
.chip{font:inherit;font-size:13px;height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--fg);white-space:nowrap;cursor:pointer}
.chip-on{background:var(--purple);border-color:var(--purple);color:var(--on-accent)}
</style>
</helmet>
<div class="{{themeClass}}" style="width: 390px; height: 900px; box-sizing: border-box; background: var(--bg); color: var(--fg); font-family: Jost, 'Century Gothic', system-ui, sans-serif; font-size: 15px; line-height: 1.45; display: flex; flex-direction: column; overflow: hidden">

  <div style="flex-grow: 1; padding: 24px 20px 12px; display: flex; flex-direction: column; gap: 16px; overflow: hidden">
    <div style="display: flex; align-items: center; gap: 12px">
      <h1 style="margin: 0; font-size: 26px; font-weight: 500; flex-grow: 1">Ejercicios</h1>
      <button type="button" style="font: inherit; font-size: 14px; font-weight: 500; color: var(--purple-ink); background: transparent; border: 1px solid var(--line); border-radius: 10px; height: 44px; padding: 0 14px; cursor: pointer">+ Crear</button>
    </div>

    <label style="display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 0 14px; height: 46px">
      <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" style="color: var(--muted); flex-shrink: 0"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></g></svg>
      <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Buscar ejercicio</span>
      <input type="search" placeholder="Buscar ejercicio" style="flex-grow: 1; min-width: 0; background: transparent; border: 0; outline: none; color: var(--fg); font: inherit">
    </label>

    <div style="display: flex; gap: 8px; flex-wrap: wrap">
      <button type="button" class="chip chip-on">Todos</button>
      <button type="button" class="chip">Pecho</button>
      <button type="button" class="chip">Espalda</button>
      <button type="button" class="chip">Pierna</button>
      <button type="button" class="chip">Hombro</button>
      <button type="button" class="chip">Brazos</button>
      <button type="button" class="chip">Core</button>
      <button type="button" class="chip">Cardio</button>
    </div>

    <div style="display: flex; flex-direction: column">
      <sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
        <div style="display: flex; flex-direction: column">
          <span style="font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); padding: 12px 0 6px">{{g.name}}</span>
          <sc-for list="{{g.items}}" as="ex" hint-placeholder-count="3">
            <a href="Ejercicio.dc.html" style="display: flex; align-items: center; gap: 14px; padding: 10px 0; border-bottom: 1px solid var(--line); text-decoration: none; color: var(--fg)">
              <span style="width: 46px; height: 46px; border-radius: 10px; background: var(--raised); color: var(--purple-ink); display: flex; align-items: center; justify-content: center; flex-shrink: 0">
                <sc-if value="{{ex.isWeights}}" hint-placeholder-val="{{true}}"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6.5 7v10M4 9v6M17.5 7v10M20 9v6M6.5 12h11"/></g></svg></sc-if>
                <sc-if value="{{ex.isBody}}" hint-placeholder-val="{{false}}"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="2"/><path d="M12 8v6M8 10l4-1 4 1M10 21l2-7 2 7"/></g></svg></sc-if>
                <sc-if value="{{ex.isCardio}}" hint-placeholder-val="{{false}}"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h4l2-5 4 10 2-5h6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></sc-if>
              </span>
              <span style="display: flex; flex-direction: column; flex-grow: 1; min-width: 0">
                <span style="font-weight: 500">{{ex.name}}</span>
                <span style="font-size: 12px; color: var(--muted)">{{ex.meta}}</span>
              </span>
              <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" style="color: var(--muted); flex-shrink: 0"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </a>
          </sc-for>
        </div>
      </sc-for>
    </div>
  </div>

  <nav aria-label="Navegación principal" style="display: flex; justify-content: space-around; padding: 10px 8px 18px; border-top: 1px solid var(--line); background: var(--surface); font-size: 11px; color: var(--muted)">
    <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 56px; color: var(--muted); text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-6.5 8 6.5V20h-5v-5.5h-6V20H4z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>Inicio</a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 56px; color: var(--purple-ink); text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M9 6.5h11M9 12h11M9 17.5h11"/><circle cx="4.5" cy="6.5" r=".6"/><circle cx="4.5" cy="12" r=".6"/><circle cx="4.5" cy="17.5" r=".6"/></g></svg>Rutinas</a>
    <a href="Progreso.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 56px; color: var(--muted); text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M5 20V12M10 20V6M15 20v-9M20 20V9"/></g></svg>Progreso</a>
    <a href="Historial.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 56px; color: var(--muted); text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.7"><rect x="4" y="5.5" width="16" height="14.5" rx="2"/><path d="M4 10h16M8.5 3.5v4M15.5 3.5v4" stroke-linecap="round"/></g></svg>Historial</a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 56px; color: var(--muted); text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="3"/><path d="M12 3.5v2.2M12 18.3v2.2M3.5 12h2.2M18.3 12h2.2M6 6l1.6 1.6M16.4 16.4L18 18M6 18l1.6-1.6M16.4 7.6L18 6" stroke-linecap="round"/></g></svg>Ajustes</a>
  </nav>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"modo":{"editor":"enum","options":["Oscuro","Claro"],"default":"Oscuro"},"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const ex = (name, meta, kind) => ({ name, meta, isWeights: kind === 'w', isBody: kind === 'b', isCardio: kind === 'c' });
    return {
      themeClass: (this.props.modo ?? 'Oscuro') === 'Claro' ? 't-light' : 't-dark',
      groups: [
        { name: 'Pecho', items: [
          ex('Press banca', 'Barra · Pecho, tríceps, hombro', 'w'),
          ex('Press inclinado con mancuernas', 'Mancuernas · Pecho superior, hombro', 'w'),
          ex('Fondos en paralelas', 'Peso corporal · Pecho, tríceps', 'b'),
          ex('Flexiones', 'Peso corporal · Pecho, tríceps, core', 'b')
        ] },
        { name: 'Espalda', items: [
          ex('Dominadas', 'Peso corporal · Dorsal, bíceps', 'b'),
          ex('Remo con barra', 'Barra · Dorsal, trapecio, bíceps', 'w')
        ] },
        { name: 'Cardio', items: [
          ex('Trotar', 'Distancia y tiempo · ritmo por km', 'c'),
          ex('Bicicleta estática', 'Tiempo · distancia opcional', 'c')
        ] }
      ]
    };
  }
}
</script>
</body>
</html>
