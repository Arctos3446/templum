<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Detalle del ejercicio</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400;1,500&amp;family=Jost:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
.t-dark{--bg:#0D0A10;--surface:#16111A;--raised:#1F1826;--line:#2F2539;--fg:#EEE7DC;--muted:#A3969F;--purple:#6B3A9E;--purple-ink:#B892E0;--purple-faint:rgba(184,146,224,.12);--crimson:#9B1E33;--crimson-ink:#E35C70;--gold:#CFA54E;--gold-faint:rgba(207,165,78,.16);--on-accent:#F7F1E6;--good:#6FB07C;--warn:#D9A441;--body:#2A2131}
.t-light{--bg:#E4D9C6;--surface:#EDE4D3;--raised:#D8CAB2;--line:#C6B396;--fg:#1D1421;--muted:#5A4C55;--purple:#4B2275;--purple-ink:#4B2275;--purple-faint:rgba(75,34,117,.12);--crimson:#7D1628;--crimson-ink:#8F1A2E;--gold:#85631A;--gold-faint:rgba(133,99,26,.14);--on-accent:#F3ECDF;--good:#2F6A3D;--warn:#8E6514;--body:#CDBEA5}
a{color:var(--purple-ink)}a:hover{color:var(--gold)}
.m{fill:var(--body)}
.m1{fill:var(--crimson-ink)}
.m2{fill:var(--purple-ink);fill-opacity:.55}
</style>
</helmet>
<div class="{{themeClass}}" style="width: 390px; height: 1000px; box-sizing: border-box; background: var(--bg); color: var(--fg); font-family: Jost, 'Century Gothic', system-ui, sans-serif; font-size: 15px; line-height: 1.45; display: flex; flex-direction: column; gap: 18px; padding: 18px 20px 24px; overflow: hidden">

  <a href="Biblioteca.dc.html" style="display: flex; align-items: center; gap: 4px; height: 44px; font-size: 15px; color: var(--purple-ink); text-decoration: none; align-self: flex-start">
    <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    Ejercicios
  </a>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <h1 style="margin: 0; font-size: 28px; font-weight: 500; line-height: 1.15">Press banca</h1>
    <div style="display: flex; gap: 6px; flex-wrap: wrap">
      <span style="font-size: 12px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted)">Pesas</span>
      <span style="font-size: 12px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted)">Barra</span>
      <span style="font-size: 12px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted)">Pecho</span>
    </div>
  </div>

  <div style="height: 196px; border-radius: 12px; border: 1px dashed var(--line); background: var(--surface); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; text-align: center; padding: 0 24px">
    <svg width="34" height="34" viewBox="0 0 24 24" aria-hidden="true" style="color: var(--muted)"><g fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M4 17l5-4 3 2 4-4 4 4" stroke-linejoin="round"/></g></svg>
    <span style="font-size: 14px; color: var(--muted)">Aquí va la foto o animación del ejercicio</span>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px">
    <span style="font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted)">Músculos que trabaja</span>
    <div style="display: flex; align-items: center; gap: 18px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px">
      <div style="display: flex; gap: 6px; flex-shrink: 0">
        <svg width="82" height="172" viewBox="0 0 100 210" role="img" aria-label="Vista frontal: pecho como músculo principal, hombro frontal como secundario">
          <circle class="m" cx="50" cy="16" r="10"/>
          <rect class="m" x="45" y="26" width="10" height="8" rx="2"/>
          <ellipse class="m2" cx="29" cy="42" rx="8" ry="7"/>
          <ellipse class="m2" cx="71" cy="42" rx="8" ry="7"/>
          <rect class="m1" x="34" y="36" width="15.5" height="20" rx="6"/>
          <rect class="m1" x="50.5" y="36" width="15.5" height="20" rx="6"/>
          <rect class="m" x="40" y="58" width="20" height="32" rx="5"/>
          <rect class="m" x="33" y="60" width="6" height="26" rx="3"/>
          <rect class="m" x="61" y="60" width="6" height="26" rx="3"/>
          <ellipse class="m" cx="23" cy="61" rx="5" ry="11"/>
          <ellipse class="m" cx="77" cy="61" rx="5" ry="11"/>
          <ellipse class="m" cx="19" cy="87" rx="4" ry="12"/>
          <ellipse class="m" cx="81" cy="87" rx="4" ry="12"/>
          <rect class="m" x="36" y="92" width="28" height="14" rx="6"/>
          <ellipse class="m" cx="42" cy="130" rx="7.5" ry="22"/>
          <ellipse class="m" cx="58" cy="130" rx="7.5" ry="22"/>
          <ellipse class="m" cx="42" cy="176" rx="5" ry="15"/>
          <ellipse class="m" cx="58" cy="176" rx="5" ry="15"/>
        </svg>
        <svg width="82" height="172" viewBox="0 0 100 210" role="img" aria-label="Vista posterior: tríceps como secundario">
          <circle class="m" cx="50" cy="16" r="10"/>
          <rect class="m" x="38" y="28" width="24" height="14" rx="6"/>
          <ellipse class="m" cx="29" cy="42" rx="8" ry="7"/>
          <ellipse class="m" cx="71" cy="42" rx="8" ry="7"/>
          <rect class="m" x="34" y="44" width="15" height="30" rx="6"/>
          <rect class="m" x="51" y="44" width="15" height="30" rx="6"/>
          <rect class="m" x="42" y="75" width="16" height="15" rx="4"/>
          <ellipse class="m2" cx="23" cy="61" rx="5" ry="11"/>
          <ellipse class="m2" cx="77" cy="61" rx="5" ry="11"/>
          <ellipse class="m" cx="19" cy="87" rx="4" ry="12"/>
          <ellipse class="m" cx="81" cy="87" rx="4" ry="12"/>
          <rect class="m" x="36" y="92" width="13.5" height="18" rx="6"/>
          <rect class="m" x="50.5" y="92" width="13.5" height="18" rx="6"/>
          <ellipse class="m" cx="42" cy="134" rx="7.5" ry="20"/>
          <ellipse class="m" cx="58" cy="134" rx="7.5" ry="20"/>
          <ellipse class="m" cx="42" cy="176" rx="5.5" ry="15"/>
          <ellipse class="m" cx="58" cy="176" rx="5.5" ry="15"/>
        </svg>
      </div>
      <div style="display: flex; flex-direction: column; gap: 12px; font-size: 14px">
        <div style="display: flex; flex-direction: column; gap: 4px">
          <span style="display: flex; align-items: center; gap: 8px; font-weight: 500"><span style="width: 12px; height: 12px; border-radius: 3px; background: var(--crimson-ink)"></span>Principal</span>
          <span style="color: var(--muted); padding-left: 20px">Pecho</span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 4px">
          <span style="display: flex; align-items: center; gap: 8px; font-weight: 500"><span style="width: 12px; height: 12px; border-radius: 3px; background: var(--purple-ink); opacity: .55"></span>Secundarios</span>
          <span style="color: var(--muted); padding-left: 20px">Hombro frontal<br>Tríceps</span>
        </div>
      </div>
    </div>
  </div>

  <div role="tablist" aria-label="Secciones del ejercicio" style="display: flex; gap: 4px; border-bottom: 1px solid var(--line)">
    <button type="button" role="tab" aria-selected="true" style="font: inherit; font-size: 14px; font-weight: 500; color: var(--fg); background: transparent; border: 0; border-bottom: 2px solid var(--gold); height: 44px; padding: 0 12px; cursor: pointer">Resumen</button>
    <button type="button" role="tab" aria-selected="false" style="font: inherit; font-size: 14px; color: var(--muted); background: transparent; border: 0; border-bottom: 2px solid transparent; height: 44px; padding: 0 12px; cursor: pointer">Historial</button>
    <button type="button" role="tab" aria-selected="false" style="font: inherit; font-size: 14px; color: var(--muted); background: transparent; border: 0; border-bottom: 2px solid transparent; height: 44px; padding: 0 12px; cursor: pointer">Cómo hacerlo</button>
  </div>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; font-variant-numeric: tabular-nums">
    <div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; color: var(--muted)">Récord de peso</span><span style="font-size: 17px; font-weight: 500; color: var(--gold)">65 kg × 3</span></div>
    <div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; color: var(--muted)">1RM estimado</span><span style="font-size: 17px; font-weight: 500">78,3 kg</span></div>
    <div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; color: var(--muted)">Mejor volumen</span><span style="font-size: 17px; font-weight: 500">2.340 kg</span></div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px">
    <span style="font-size: 12px; color: var(--muted)">Última vez · hoy</span>
    <span style="font-variant-numeric: tabular-nums">60 × 10 · 60 × 10 · 62,5 × 8 · 62,5 × 8</span>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"modo":{"editor":"enum","options":["Oscuro","Claro"],"default":"Oscuro"},"$preview":{"width":390,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    return { themeClass: (this.props.modo ?? 'Oscuro') === 'Claro' ? 't-light' : 't-dark' };
  }
}
</script>
</body>
</html>
